services:
  php:
    image: ghcr.io/phpyh/php:${PHP_VERSION:-8.2}
    user: ${DOCKER_USER:-}
    working_dir: /workspace
    environment:
      IN_CONTAINER: true
      HISTFILE: /workspace/var/.docker_history
    volumes:
      - .:/workspace
      - ${COMPOSER_CACHE_DIR:-~/.cache/composer}:/composer/cache
    tty: true
    init: true
